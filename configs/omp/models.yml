providers:
  gpustack:
    baseUrl: https://baai.ba.bigant-internal.com/v1-openai
    apiKey: GPUSTACK_API_KEY
    api: openai-completions
    authHeader: true
    discovery:
      type: openai-models-list
      injectV1: false
    modelOverrides:
      qwen3.8-27b-nvfp4:
        name: Qwen3.8 27B NVFP4 (GPUStack)
        contextWindow: 262144
        maxTokens: 32768
        reasoning: true
        input: [text, image]
        supportsTools: true
        tokenizer: qwen3
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high]
          defaultLevel: low
          requiresEffort: false
        compat:
          thinkingFormat: qwen-chat-template
          reasoningContentField: reasoning
      qwen3-4b-awq:
        name: Qwen3 4B AWQ (GPUStack)
        contextWindow: 262144
        maxTokens: 32768
        reasoning: true
        supportsTools: true
        tokenizer: qwen3
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high]
          defaultLevel: low
          requiresEffort: false
        compat:
          thinkingFormat: qwen-chat-template
          reasoningContentField: reasoning